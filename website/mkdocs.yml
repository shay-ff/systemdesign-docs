site_name: System Design Docs
site_description: Interview-oriented system design learning guide — foundations, LLD, HLD, interview prep, and study plans.
repo_url: https://github.com/shay-ff/systemdesign-docs
repo_name: shay-ff/systemdesign-docs

docs_dir: docs
site_dir: ../systemdesign-docs-site

exclude_docs: |
  DEPLOY.md
  **/*.java
  **/*.py
  **/*.go
  **/*.cpp
  **/*.hpp
  **/*.c
  **/*.h
  **/*.html
  **/Dockerfile
  **/Dockerfile.*
  **/docker-compose*.yml
  **/Makefile
  **/go.mod
  **/go.sum
  **/prometheus.yml
  **/requirements.txt
  01-ll-designs/**/solutions/
  01-ll-designs/**/src/
  03-implementations/**/load-test/
  03-implementations/**/benchmarks/
  03-implementations/**/clients/
  03-implementations/**/examples/
  assets/README.txt

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

